header:
  version: 18
  includes:
    - base.yml

machine: qemux86-64
distro: poky

target: iceoryx2-image-full

repos:
  poky:
    url: https://git.yoctoproject.org/poky.git
    branch: scarthgap
    layers:
      meta:
      meta-poky:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:

local_conf_header:
  meta-custom: |
    INHERIT += "rm_work"
    PACKAGE_CLASSES = "package_ipk"
